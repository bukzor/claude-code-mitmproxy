[project]
name = "claude-mitmproxy"
version = "0.1.0"
description = "Reverse-proxy that records and rewrites Claude Code traffic"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
# Runtime only, and only the addons need even this: every library module
# imports without mitmproxy, which is what lets the checks run offline.
dependencies = [
    "llm-claims-kb",
    "llm-kb",
    "mitmproxy>=12.2.3",
]

[project.scripts]
# One command per check, printing its data and then its verdict, exiting 2 when
# a predicate found something -- so `if claude-mitmproxy-check-masks; then`
# reads correctly in a shell. `monitoring/` asserts the same PREDICATES; see
# verdict.py for the normal form both halves share.
claude-mitmproxy-check-masks = "claude_mitmproxy.check_masks:main"
claude-mitmproxy-check-laws = "claude_mitmproxy.check_laws:main"
claude-mitmproxy-check-patches = "claude_mitmproxy.check_patches:main"
claude-mitmproxy-check-dark-patches = "claude_mitmproxy.check_dark_patches:main"
claude-mitmproxy-check-strip-floors = "claude_mitmproxy.check_strip_floors:main"
claude-mitmproxy-check-tool-patches = "claude_mitmproxy.check_tool_patches:main"

# Tools, not checks: they answer a question rather than pass or fail, so they
# have no predicates and nothing to exit 2 about.
claude-mitmproxy-render-patched = "claude_mitmproxy.render_patched:main"
claude-mitmproxy-dump-core = "claude_mitmproxy.dump_core:main"
claude-mitmproxy-diff-matrices = "claude_mitmproxy.diff_matrices:main"
claude-mitmproxy-survey-captures = "claude_mitmproxy.survey_captures:main"
claude-mitmproxy-compress-traffic = "claude_mitmproxy.compress_traffic:main"
claude-mitmproxy-gc-patch-failures = "claude_mitmproxy.gc_patch_failures:main"
# Not a proxy tool: byte-patches the on-disk Claude Code binary for behavior
# that never crosses the wire. Also runs as a SessionStart hook by file path.
claude-mitmproxy-binpatch = "claude_mitmproxy.binpatch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Editable-from-the-repo is the only supported install: `repo_paths.ROOT`
# walks up from `__file__` to find `masks.d/`, `blocks.d/` and `log/`, which
# a wheel does not carry and a site-packages install could not locate. `uv
# build` is a check that the layout is coherent, not a step toward publishing.
#
# One package, one name per module. mitmproxy loads each addon by path and
# registers it as `__mitmproxy_script__.<stem>`, so the addon copy is never the
# imported copy -- mitmproxy re-executes the addon one on mtime change,
# reload.py re-executes the library one. That pairing needs every *importer* to
# agree on one name per module, which package-qualifying does not disturb.
packages = ["lib/claude_mitmproxy"]

[tool.pyright]
venvPath = "."
venv = ".venv"
# Bare `pyright` is the whole-project command, so anything it reports has to be
# worth acting on. trash/ is throwaway by definition -- abandoned scripts written
# against APIs that have since moved -- and log/ is runtime output.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "trash", "log"]

[tool.pytest.ini_options]
# Two suites, both run by a bare `pytest`: tests/ checks the machinery against
# fixtures it builds itself, monitoring/ checks the real data on disk. A red
# monitoring/ is triage, not a broken build -- see monitoring/CLAUDE.md.
testpaths = ["tests", "monitoring"]
# The package lives under lib/, so lib/ is what goes on sys.path -- the same
# entry proxy.sh exports. Relative to rootdir, so it holds from any cwd.
pythonpath = ["lib"]
# Everything this repo's tooling writes at runtime lives under the gitignored
# log/, test scratch included -- and unlike /tmp it survives a reboot, so a
# failed run is still inspectable tomorrow.
addopts = "--basetemp=log/pytest"

[tool.uv.sources]
basedpyright-as-pyright = { path = "../../repo/github.com/bukzor/basedpyright-as-pyright" }
llm-claims-kb = { path = "../../repo/github.com/bukzor/bukzor-agent-skills/llm-claims-kb", editable = true }
llm-kb = { path = "../../repo/github.com/bukzor/bukzor-agent-skills/llm-kb", editable = true }

[dependency-groups]
dev = [
    "basedpyright-as-pyright",
    "pytest>=9.1.1",
]
